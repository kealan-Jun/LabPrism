[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labprism"
version = "0.1.0"
description = "Laboratory visual understanding and its website/demo experience"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "scipy>=1.13,<2", "opencv-python-headless>=4.10,<4.12"]
tracking = ["scipy>=1.13,<2", "opencv-python-headless>=4.10,<4.12"]
browser = ["playwright>=1.55,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
